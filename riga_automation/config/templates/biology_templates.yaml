      can be recognized? Assume random cross-reactivity.
      (d) How does the answer change if cross-reactivity is structured (similar peptides
      recognized by similar TCRs)?
      
      \\textbf{Solution Steps:}
      1. Compute combinatorial diversity: $V \\times D \\times J \\times \\text{junctional}$
      2. Apply selection bottleneck (1\%)
      3. Use coupon collector / coverage argument for peptide recognition
      4. Structured cross-reactivity: model as correlated recognition (qualitative)
      
      \\end{document}
