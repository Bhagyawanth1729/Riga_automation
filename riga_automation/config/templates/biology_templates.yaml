      \\begin{document}
      
      \\textbf{Problem:} A nucleosome can be in states: unmodified (U), methylated (M), acetylated (A).
      Methylation is catalyzed by a writer enzyme recruited by existing M marks (positive feedback):
      $U \\xrightarrow{k_+ m} M$, where $m$ is number of neighboring M nucleosomes.
      Demethylation occurs at rate $k_-$. Acetylation ($U \\to A$) antagonizes methylation.
      
      Consider a 1D array of $N$ nucleosomes. Using mean-field approximation,
      derive the condition for bistability (coexistence of M-rich and A-rich domains).
      What is the mean switching time between states due to finite-$N$ fluctuations?
      
      If $N=100$, $k_+/k_- = 10$, and acetylation rate $k_A = 0.1 k_+$,
      estimate the epigenetic memory lifetime.
      
      \\textbf{Solution Steps:}
      1. Mean-field equations for fraction of M and A nucleosomes
      2. Find fixed points, analyze stability (bistability condition)
      3. Map to 1D Ising-like model, compute energy barrier
      4. Kramers escape time: $\\tau \\sim e^{\\Delta E}$
      5. Numerical estimate with given parameters
      
      \\end{document}
