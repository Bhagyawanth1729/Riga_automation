      only $\\sim 1\\%$ of generated sequences. Each TCR recognizes $\\sim 10^6$ distinct
      peptide-MHC complexes (cross-reactivity).
      
      (a) Estimate the theoretical maximum diversity from V(D)J recombination alone.
      (b) Estimate the functional repertoire size after thymic selection.
