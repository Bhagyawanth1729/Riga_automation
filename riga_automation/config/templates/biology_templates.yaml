    reasoning_types: [quantitative_reasoning, graph_interpretation, conceptual_synthesis]
    difficulty_range: [medium, hard]
    failure_patterns: [phase_diagram_metastable, cross_domain_synthesis, literature_recent]
    description: |
      Flory-Huggins / sticker-spacer model for protein phase separation.
      Saturation concentration, phase diagram, effect of mutations.
    latex_skeleton: |
      \\documentclass{article}
      \\usepackage{amsmath, amssymb, siunitx}
      \\begin{document}
      
      \\textbf{Problem:} A protein with $N$ residues has $n_s$ "sticker" domains that mediate
      weak multivalent interactions. Using the sticker-spacer model, the saturation
      concentration $c_{\\text{sat}}$ for phase separation is approximately:
      $$c_{\\text{sat}} \\approx \\frac{1}{v} \\exp\\left(\\frac{\\Delta G_{\\text{sticker}}}{k_B T} \\cdot \\frac{n_s}{N} \\right)$$
      where $v$ is molecular volume, $\\Delta G_{\\text{sticker}}$ is sticker interaction energy.
      
      (a) Derive this expression from Flory-Huggins free energy with associative stickers.
      (b) A mutation replaces one sticker with a non-interacting residue ($n_s \\to n_s - 1$).
      By what factor does $c_{\\text{sat}}$ change? If $\\Delta G_{\\text{sticker}} = -5 k_B T$,
      $n_s = 6$, $N = 300$, what is the fold-change?
      (c) The protein also binds RNA with dissociation constant $K_d$. RNA acts as a scaffold
      that increases effective valency. How does $c_{\\text{sat}}$ depend on RNA concentration?
      
      \\textbf{Solution Steps:}
      1. Flory-Huggins free energy with associative term $\\sim n_s \\phi \\ln \\phi$
      2. Find binodal (phase boundary) by equal chemical potential
      3. Analyze mutation effect on exponential scaling
      4. Add RNA binding: effective valency increases with [RNA]
      
      \\end{document}
    concepts:
      - Liquid-liquid phase separation
      - Sticker-spacer model
      - Flory-Huggins theory
      - RNA scaffolding of condensates
    literature_anchors:
      - "Harmon et al. (2017) PNAS"
      - "Choi et al. (2020) Science"
      - "Riback et al. (2020) Nature"
    variability_axes:
